spring.application.name=task-scheduler-service
confighost=http://localhost:8888/config
spring.config.import=optional:configserver:${confighost}
spring.profiles.active=default

workflow.cron.deleteExpression=0 8 ? * MON,TUE,THU,FRI
workflow.cron.deleteConductorOrphans.expression=0 10 ? * MON,TUE,THU,FRI
workflow.cron.deleteConductorOrphans.enabled=false
workflow.cron.deleteMax=1

logging.level.org.springframework.cloud.config.client.ConfigServerConfigDataLoader=WARN

spring.quartz.job-store-type=memory
management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.info.access=read-only

spring.security.oauth2.client.registration.oidc.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.oidc.client-id=task-scheduler
spring.security.oauth2.client.registration.oidc.client-secret=secret-da-impostare
spring.security.oauth2.client.registration.oidc.scope=openid
spring.security.oauth2.client.registration.oidc.provider=oidc
spring.security.oauth2.client.provider.oidc.issuer-uri=https://dica33.ba.cnr.it/keycloak/realms/trasparenzai

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dica33.ba.cnr.it/keycloak/realms/trasparenzai
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dica33.ba.cnr.it/keycloak/realms/trasparenzai/protocol/openid-connect/certs

transparency.clients.result-service.url=http://localhost:8081
transparency.clients.result-aggregator-service.url=http://localhost:8083

# Timeout di connessione (5 secondi) e lettura (300 secondi = 5 minuti)
spring.cloud.openfeign.client.config.conductor-client.connect-timeout=5000
spring.cloud.openfeign.client.config.conductor-client.read-timeout=300000

spring.cloud.openfeign.client.config.result-service-client.connect-timeout=5000
spring.cloud.openfeign.client.config.result-service-client.read-timeout=600000

spring.cloud.openfeign.client.config.result-aggregator-service-client.connect-timeout=5000
spring.cloud.openfeign.client.config.result-aggregator-service-client.read-timeout=300000